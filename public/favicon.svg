<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!-- Circular border -->
  <circle cx="60" cy="60" r="56" fill="#071210" stroke="#10b981" stroke-width="2"/>

  <!-- Radar concentric circles -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.2"/>
  <circle cx="60" cy="60" r="28" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.15"/>

  <!-- Crosshairs -->
  <line x1="60" y1="4" x2="60" y2="116" stroke="#10b981" stroke-width="0.5" opacity="0.12"/>
  <line x1="4" y1="60" x2="116" y2="60" stroke="#10b981" stroke-width="0.5" opacity="0.12"/>

  <!-- Scan sweep sector -->
  <defs>
    <radialGradient id="sweep" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M60,60 L60,4 A56,56 0 0,1 108,38 Z" fill="url(#sweep)" opacity="0.15"/>
  <line x1="60" y1="60" x2="108" y2="38" stroke="#34d399" stroke-width="0.8" opacity="0.4"/>

  <!-- Airplane glow -->
  <circle cx="60" cy="60" r="12" fill="#34d399" opacity="0.07"/>

  <!-- Airplane (minimal line-art, 45° tilt) -->
  <g transform="translate(60,60) rotate(-45) scale(1.5)">
    <path d="M0,-26 C1.5,-24 2.5,-18 2.5,-4 L20,5 L20,8 L2.5,5 L2.5,18 L8,22 L8,24 L0,21 L-8,24 L-8,22 L-2.5,18 L-2.5,5 L-20,8 L-20,5 L-2.5,-4 C-2.5,-18 -1.5,-24 0,-26 Z" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>
    <!-- ADS-B signal arcs -->
    <path d="M-9,-32 A12,12 0 0,1 9,-32" fill="none" stroke="#34d399" stroke-width="1" opacity="0.45"/>
    <path d="M-15,-38 A20,20 0 0,1 15,-38" fill="none" stroke="#34d399" stroke-width="0.7" opacity="0.25"/>
  </g>

  <!-- Flight-dots with short trails -->
  <path d="M80,27 L84,29" fill="none" stroke="#34d399" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
  <circle cx="84" cy="29" r="2.5" fill="#34d399" opacity="0.9"/>

  <path d="M32,46 L35,44" fill="none" stroke="#34d399" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
  <circle cx="35" cy="44" r="2" fill="#34d399" opacity="0.6"/>

  <path d="M90,78 L93,80" fill="none" stroke="#34d399" stroke-width="0.6" opacity="0.2" stroke-linecap="round"/>
  <circle cx="93" cy="80" r="1.8" fill="#34d399" opacity="0.45"/>

  <circle cx="48" cy="90" r="1.5" fill="#34d399" opacity="0.3"/>
</svg>
