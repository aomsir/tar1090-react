<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" fill="none">
  <rect width="800" height="200" rx="12" fill="#071210"/>

  <!-- Subtle radar grid background -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#10b981" stroke-width="0.5" opacity="0.08"/>
  <line x1="200" y1="0" x2="200" y2="200" stroke="#10b981" stroke-width="0.5" opacity="0.08"/>
  <line x1="400" y1="0" x2="400" y2="200" stroke="#10b981" stroke-width="0.5" opacity="0.08"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#10b981" stroke-width="0.5" opacity="0.08"/>

  <!-- Decorative flight trail -->
  <path d="M0,160 Q200,120 350,100 Q500,80 650,50 Q750,30 800,25" fill="none" stroke="#34d399" stroke-width="1" opacity="0.15" stroke-dasharray="6,4"/>

  <!-- Icon (simplified version of favicon) -->
  <g transform="translate(100,100)">
    <circle cx="0" cy="0" r="60" fill="#071210" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#10b981" stroke-width="0.6" opacity="0.2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#10b981" stroke-width="0.6" opacity="0.15"/>
    <path d="M0,0 L0,-60 A60,60 0 0,1 52,-30 Z" fill="#34d399" opacity="0.06"/>
    <line x1="0" y1="0" x2="52" y2="-30" stroke="#34d399" stroke-width="0.6" opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="#34d399" opacity="0.07"/>
    <g transform="rotate(-45)">
      <path d="M0,-26 C1.5,-24 2.5,-18 2.5,-4 L20,5 L20,8 L2.5,5 L2.5,18 L8,22 L8,24 L0,21 L-8,24 L-8,22 L-2.5,18 L-2.5,5 L-20,8 L-20,5 L-2.5,-4 C-2.5,-18 -1.5,-24 0,-26 Z" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M-9,-32 A12,12 0 0,1 9,-32" fill="none" stroke="#34d399" stroke-width="0.8" opacity="0.4"/>
    </g>
    <circle cx="28" cy="-18" r="2" fill="#34d399" opacity="0.7"/>
    <circle cx="-20" cy="-8" r="1.5" fill="#34d399" opacity="0.5"/>
  </g>

  <!-- Project name -->
  <text x="220" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="42" font-weight="700" fill="#34d399">tar1090-react</text>

  <!-- Tagline -->
  <text x="220" y="130" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="18" fill="#6ee7b7" opacity="0.7">Modern ADS-B Aircraft Tracking</text>
</svg>
